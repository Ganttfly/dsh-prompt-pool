<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>prompt pool · panel geometry</title>
<style>
:root{
  --dsw-alias-bg-base:#ffffff;--dsw-alias-bg-layer-1:#ffffff;--dsw-alias-bg-layer-2:#f6f7f9;--dsw-alias-bg-overlay:#ffffff;
  --dsw-alias-border-l1:#e5e7eb;--dsw-alias-border-l2:#dfe2e9;--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#646a73;
  --dsw-alias-state-business-primary:#4d6bfe;--dsw-alias-brand-primary:#4d6bfe;--dsw-alias-interactive-bg-hover:#f2f3f5;
  --dsw-alias-state-error-primary:#f54a45;--dsw-alias-state-success-primary:#2ea121;--dsw-radius-panel:12px;
}
html,body{height:100%}
body{margin:0;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#1f2329;background:#fff}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{flex:none;width:236px;background:var(--dsw-alias-bg-layer-2);border-right:1px solid var(--dsw-alias-border-l1)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
/* The window has its own top bar; the conversation pane below it clips its
   overflow, which is where the panel's header used to disappear. */
.topbar{flex:none;display:flex;align-items:center;height:56px;padding:0 24px;font-weight:600;color:#4d6bfe}
.pane{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:0 24px}
.hero{flex:none;height:var(--composer-top,34vh)}
.composer-wrap{position:relative;width:min(760px,100%);margin:0 auto}
.composer{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--dsw-alias-border-l2);border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.06)}
.composer-input{min-height:56px;color:var(--dsw-alias-label-secondary)}
.composer-foot{display:flex;align-items:center;gap:8px}
.composer-foot .spacer{flex:1}
.model{font-size:12px;color:var(--dsw-alias-label-secondary)}
/* Same shape as the host overlay slot: an absolutely positioned layer over the
   composer, transparent to the pointer except for the panel itself. */
.overlay{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.overlay .pp-panel{pointer-events:auto}
.tail{flex:1}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar">deepseek</header>
    <section class="pane" id="pane">
      <div class="hero"></div>
      <div class="composer-wrap" id="composer">
        <div class="composer">
          <div class="composer-input">描述你想要构建的内容，/ 调用指令，@ 文件或对话</div>
          <div class="composer-foot"><span id="trigger-slot"></span><span class="spacer"></span><span class="model">DeepSeek-Flash Max</span></div>
        </div>
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="tail"></div>
    </section>
  </div>
</div>
<script>
// --tray N seeds the send queue so the queue card's growth can be measured.
(function () {
  const count = Number(new URL(window.location.href).searchParams.get('tray'));
  if (!(count > 0)) return;
  const entries = Array.from({ length: count }, (_, index) => ({
    key: 'seed-key-' + index,
    itemId: 'seed-item-' + index,
    body: 'I love DSH. It is damn powerful! I love the dsh-prompt-pool plugin. It is damn helpful!',
    images: [],
  }));
  // A version above the plugin's own POOL_VERSION keeps the store from
  // reseeding over this fixture.
  window.localStorage.setItem(
    'dsh.prompt-pool.v1',
    JSON.stringify({ version: 999, categories: [], items: [], tray: entries, settings: {}, seeded: 999 }),
  );
})();
</script>
<script src="/vendor.js"></script>
<script>window.__ModuleLoader__ = { load(spec) { window.__ppSpec = spec; } };</script>
<script src="/plugin/client.js"></script>
<script src="/boot.js"></script>
</body>
</html>
